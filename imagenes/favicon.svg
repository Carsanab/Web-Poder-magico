<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fondo espacial con gradiente -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#05020f"/>
    </radialGradient>
    
    <!-- Gradiente del sombrero -->
    <linearGradient id="hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    
    <!-- Gradiente de la barba -->
    <linearGradient id="beard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    
    <!-- Gradiente del humo mágico -->
    <linearGradient id="smoke" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.3"/>
    </linearGradient>
    
    <!-- Glow para los lentes -->
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    
    <!-- Filtro de brillo -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo circular -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  
  <!-- Estrellas de fondo -->
  <circle cx="80" cy="100" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="420" cy="80" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="100" cy="400" r="2" fill="#fbbf24" opacity="0.7"/>
  <circle cx="440" cy="380" r="2.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="60" cy="250" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="460" cy="220" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="60" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="350" cy="450" r="2" fill="#fff" opacity="0.7"/>
  
  <!-- Humo mágico verde (detrás del mago) -->
  <path d="M 380 320 Q 420 280 400 230 Q 380 180 420 140 Q 450 110 430 70" 
        stroke="url(#smoke)" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M 390 330 Q 430 290 410 240 Q 390 190 430 150" 
        stroke="#4ade80" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Cuerpo/barba del mago -->
  <path d="M 180 280 Q 160 380 200 450 Q 256 480 312 450 Q 352 380 332 280 Z" 
        fill="url(#beard)"/>
  
  <!-- Ondas de la barba -->
  <path d="M 200 320 Q 220 340 240 320 Q 260 340 280 320 Q 300 340 320 320" 
        stroke="#6d28d9" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 195 370 Q 220 390 245 370 Q 270 390 295 370 Q 315 390 330 370" 
        stroke="#6d28d9" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 210 420 Q 240 440 270 420 Q 295 440 315 420" 
        stroke="#6d28d9" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Bigote -->
  <path d="M 210 270 Q 230 290 256 285 Q 282 290 302 270 Q 290 300 256 295 Q 222 300 210 270 Z" 
        fill="#6d28d9"/>
  
  <!-- Cara (pequeña, entre barba y sombrero) -->
  <ellipse cx="256" cy="240" rx="50" ry="45" fill="#d4a574"/>
  
  <!-- Nariz -->
  <ellipse cx="256" cy="255" rx="8" ry="10" fill="#b8865a"/>
  
  <!-- Lentes de sol naranjas -->
  <g filter="url(#glow)">
    <rect x="200" y="220" width="45" height="30" rx="15" fill="url(#lensGlow)"/>
    <rect x="267" y="220" width="45" height="30" rx="15" fill="url(#lensGlow)"/>
    <line x1="245" y1="235" x2="267" y2="235" stroke="#1f2937" stroke-width="4"/>
  </g>
  
  <!-- Reflejos en los lentes -->
  <ellipse cx="215" cy="228" rx="8" ry="5" fill="#fff" opacity="0.5"/>
  <ellipse cx="282" cy="228" rx="8" ry="5" fill="#fff" opacity="0.5"/>
  
  <!-- Sombrero púrpura -->
  <path d="M 150 230 Q 180 80 256 50 Q 332 80 362 230 Q 380 250 360 260 Q 256 270 152 260 Q 132 250 150 230 Z" 
        fill="url(#hat)"/>
  
  <!-- Banda del sombrero -->
  <path d="M 160 220 Q 256 240 352 220 L 355 245 Q 256 265 157 245 Z" 
        fill="#1f2937"/>
  
  <!-- Hebilla de la banda -->
  <rect x="240" y="225" width="32" height="24" rx="3" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <line x1="256" y1="225" x2="256" y2="249" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Punta del sombrero curvada -->
  <path d="M 256 50 Q 280 30 310 45 Q 330 55 320 75" 
        stroke="#7c3aed" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Pipa verde -->
  <g>
    <!-- Taza de la pipa -->
    <path d="M 140 340 Q 130 320 150 310 Q 170 305 180 320 L 175 360 Q 160 370 145 360 Z" 
          fill="#15803d"/>
    <ellipse cx="160" cy="315" rx="20" ry="8" fill="#166534"/>
    
    <!-- Boquilla de la pipa -->
    <path d="M 180 340 L 220 355 L 220 365 L 180 355 Z" 
          fill="#15803d"/>
    <ellipse cx="220" cy="360" rx="5" ry="6" fill="#0f5132"/>
    
    <!-- Humo saliendo de la pipa -->
    <path d="M 160 310 Q 150 280 170 260 Q 180 240 165 220" 
          stroke="#4ade80" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
    <path d="M 160 310 Q 140 285 160 265 Q 175 245 160 225" 
          stroke="#86efac" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Partículas mágicas verdes -->
  <circle cx="150" cy="250" r="4" fill="#4ade80" opacity="0.8" filter="url(#glow)"/>
  <circle cx="170" cy="200" r="3" fill="#86efac" opacity="0.7"/>
  <circle cx="400" cy="180" r="5" fill="#4ade80" opacity="0.8" filter="url(#glow)"/>
  <circle cx="420" cy="120" r="3" fill="#86efac" opacity="0.7"/>
  <circle cx="380" cy="250" r="4" fill="#4ade80" opacity="0.6"/>
</svg>